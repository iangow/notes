project:
  type: website
  render:
    - index.qmd
    - published/*.qmd
    - db2pq_test/*.qmd
    - plotnine_test/*.qmd
    - ggsql_test/*.qmd
    - cash-flows/index.qmd
  resources:
    - published/*.pdf
    - cash-flows/cash-flows.pdf
    - cash-flows/cash-flows.qmd
    - cash-flows/cash-flows-references.bib
    - cash-flows/cash-flows.csl
    - db2pq_test/*.pdf
    - plotnine_test/*.pdf
  post-render:
    - python3 scripts/version-site-assets.py

execute:
  keep-ipynb: false

website:
  title: "notes"
  navbar:
    right:
      - href: index.qmd
        text: Home

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    css: assets/notes-theme.css
    toc: true
