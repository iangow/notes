project:
  type: website
  render:
    - index.qmd
    - blog.qmd
    - form_ap_names.qmd
    - published/*.qmd
    - posts/*.qmd
    - "!published/valuation_methods.qmd"
    - db2pq_test/*.qmd
    - plotnine_test/*.qmd
    - ggsql_test/*.qmd
    - cash-flows/cash-flows.qmd
  resources:
    - growth.pdf
    - tariffs.pdf
    - published/growth/**
    - published/*.typ
    - "!published/valuation_methods.typ"
    - published/*-requirements.txt
    - published/linkedin-solutions-references.bib
    - published/linkedin-solutions.csl
    - posts/*.pdf
    - posts/*.typ
    - posts/images/**
    - published/skylines/**
    - form_ap_names.pdf
    - published/*.pdf
    - "!published/valuation_methods.pdf"
    - cash-flows/cash-flows.pdf
    - cash-flows/cash-flows.qmd
    - cash-flows/cash-flows-references.bib
    - cash-flows/cash-flows.csl
    - db2pq_test/*.pdf
    - plotnine_test/*.pdf
  pre-render:
    - python3 scripts/build-blog.py
  post-render:
    - python3 scripts/version-site-assets.py

execute:
  keep-ipynb: false

website:
  title: "notes"
  navbar:
    right:
      - href: index.qmd
        text: Home
      - href: blog.qmd
        text: Blog

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    css: assets/notes-theme.css
    toc: true
